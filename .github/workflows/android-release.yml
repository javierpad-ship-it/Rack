name: Android Release (AAB firmado)

# Genera el App Bundle (.aab) firmado con la clave de subida, listo para
# publicarlo manualmente en Google Play Console (Producción / Testing interno).
# Requiere los secrets del repo:
#   RACK_UPLOAD_KEYSTORE_BASE64, RACK_UPLOAD_STORE_PASSWORD,
#   RACK_UPLOAD_KEY_ALIAS, RACK_UPLOAD_KEY_PASSWORD
# y (opcionales, si no están se usan las públicas por defecto):
#   SUPABASE_URL, SUPABASE_ANON_KEY

on:
  workflow_dispatch:
  push:
    tags:
      - 'mobile-v*'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode & verify upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.RACK_UPLOAD_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.RACK_UPLOAD_STORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.RACK_UPLOAD_KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > rack-one-upload.keystore
          if ! keytool -list -keystore rack-one-upload.keystore -storepass "$KS_PASS" >/dev/null 2>&1; then
            echo "::error::Keystore inválido. Revisá el secret RACK_UPLOAD_KEYSTORE_BASE64 (pegá TODO el contenido del .txt, una sola línea) y RACK_UPLOAD_STORE_PASSWORD."
            exit 1
          fi
          if ! keytool -list -keystore rack-one-upload.keystore -storepass "$KS_PASS" -alias "$KS_ALIAS" >/dev/null 2>&1; then
            echo "::error::El alias no existe en el keystore. El secret RACK_UPLOAD_KEY_ALIAS debe ser exactamente 'rackone-upload' (no pegues ahí el base64)."
            exit 1
          fi
          echo "Keystore + alias OK ($(stat -c%s rack-one-upload.keystore) bytes)"

      - name: Compute version code
        run: echo "VERSION_CODE=$(( GITHUB_RUN_NUMBER + 100 ))" >> "$GITHUB_ENV"

      # Los valores se pasan como env ORG_GRADLE_PROJECT_*, que Gradle mapea a
      # propiedades de proyecto (findProperty). Así evitamos interpolarlos en la
      # línea de comando del shell (comillas/caracteres especiales rompían el build).
      - name: Build signed release AABs (Inventario + Repo)
        env:
          # versionCode único y creciente por corrida (Play no permite reusar).
          # Se calcula en el paso anterior (run_number + 100) y llega por env.
          ORG_GRADLE_PROJECT_VERSION_CODE: ${{ env.VERSION_CODE }}
          ORG_GRADLE_PROJECT_SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://xeuezawuivushqrkzjqq.supabase.co' }}
          ORG_GRADLE_PROJECT_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || 'sb_publishable_hluqQhuiQ4JMTNNAu8kctQ_0TbjPtzL' }}
          ORG_GRADLE_PROJECT_RACK_UPLOAD_STORE_FILE: ${{ github.workspace }}/mobile/rack-one-upload.keystore
          ORG_GRADLE_PROJECT_RACK_UPLOAD_STORE_PASSWORD: ${{ secrets.RACK_UPLOAD_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RACK_UPLOAD_KEY_ALIAS: ${{ secrets.RACK_UPLOAD_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RACK_UPLOAD_KEY_PASSWORD: ${{ secrets.RACK_UPLOAD_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace bundleRelease

      - name: Remove keystore from runner
        if: always()
        run: rm -f rack-one-upload.keystore

      - name: Upload AAB - Inventario
        uses: actions/upload-artifact@v4
        with:
          name: rack-one-inventario-release-aab
          path: mobile/app/build/outputs/bundle/inventarioRelease/app-inventario-release.aab
          if-no-files-found: error

      - name: Upload AAB - Repo
        uses: actions/upload-artifact@v4
        with:
          name: rack-one-repo-release-aab
          path: mobile/app/build/outputs/bundle/repoRelease/app-repo-release.aab
          if-no-files-found: error
