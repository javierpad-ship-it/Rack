name: Android Release (AAB firmado)

# Genera el App Bundle (.aab) firmado con la clave de subida, listo para
# publicarlo manualmente en Google Play Console (Producción / Testing interno).
# Requiere los secrets del repo:
#   RACK_UPLOAD_KEYSTORE_BASE64, RACK_UPLOAD_STORE_PASSWORD,
#   RACK_UPLOAD_KEY_ALIAS, RACK_UPLOAD_KEY_PASSWORD
# y (opcionales, si no están se usan las públicas por defecto):
#   SUPABASE_URL, SUPABASE_ANON_KEY

on:
  workflow_dispatch:
  push:
    tags:
      - 'mobile-v*'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode upload keystore
        run: echo "${{ secrets.RACK_UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > rack-one-upload.keystore

      - name: Build signed release AABs (Inventario + Repo)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease \
            -PSUPABASE_URL="${{ vars.SUPABASE_URL || 'https://xeuezawuivushqrkzjqq.supabase.co' }}" \
            -PSUPABASE_ANON_KEY="${{ vars.SUPABASE_ANON_KEY || 'sb_publishable_hluqQhuiQ4JMTNNAu8kctQ_0TbjPtzL' }}" \
            -PRACK_UPLOAD_STORE_FILE="$(pwd)/rack-one-upload.keystore" \
            -PRACK_UPLOAD_STORE_PASSWORD="${{ secrets.RACK_UPLOAD_STORE_PASSWORD }}" \
            -PRACK_UPLOAD_KEY_ALIAS="${{ secrets.RACK_UPLOAD_KEY_ALIAS }}" \
            -PRACK_UPLOAD_KEY_PASSWORD="${{ secrets.RACK_UPLOAD_KEY_PASSWORD }}"

      - name: Remove keystore from runner
        if: always()
        run: rm -f rack-one-upload.keystore

      - name: Upload AAB - Inventario
        uses: actions/upload-artifact@v4
        with:
          name: rack-one-inventario-release-aab
          path: mobile/app/build/outputs/bundle/inventarioRelease/app-inventario-release.aab
          if-no-files-found: error

      - name: Upload AAB - Repo
        uses: actions/upload-artifact@v4
        with:
          name: rack-one-repo-release-aab
          path: mobile/app/build/outputs/bundle/repoRelease/app-repo-release.aab
          if-no-files-found: error
