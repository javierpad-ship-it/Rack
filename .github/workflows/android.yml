name: Android APK

# Compila el APK del módulo mobile/ (Honeywell ScanPal EDA52) y lo publica como
# artefacto. Railway no compila ni hospeda apps Android: este es el camino de build.
on:
  push:
    paths: ["mobile/**"]
  pull_request:
    paths: ["mobile/**"]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # El wrapper no está versionado; lo generamos (gradle viene preinstalado en el runner).
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Unit tests (JVM)
        run: ./gradlew :app:testDebugUnitTest

      - name: Build debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: ./gradlew assembleDebug -PSUPABASE_URL="$SUPABASE_URL" -PSUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rack-debug-apk
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # --- Firma de release (opcional, futuro) ----------------------------------
  # Para distribuir un APK firmado en vez del debug:
  #   1. Generar un keystore y guardarlo como secret base64 (RELEASE_KEYSTORE_BASE64),
  #      junto con RELEASE_STORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD.
  #   2. Agregar un signingConfig 'release' en mobile/app/build.gradle.kts que lea esas props.
  #   3. Decodificar el keystore en el runner y correr ./gradlew assembleRelease.
  # Por ahora el APK debug alcanza para instalación interna en los EDA52 (MDM/adb).
