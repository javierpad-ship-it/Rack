name: Android Tests

# Corre los tests unitarios (JVM) del módulo mobile/ para ambos flavors
# (Inventario y Repo). El build de APK/AAB vive en android-apk.yml /
# android-release.yml — este workflow no duplica esa parte.
on:
  push:
    paths: ["mobile/**"]
  pull_request:
    paths: ["mobile/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Unit tests (JVM) — Inventario + Repo
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testInventarioDebugUnitTest testRepoDebugUnitTest
