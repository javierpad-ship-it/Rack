name: Android APK (Honeywell)

# Compila el APK de campo (debug) y lo deja como artefacto descargable.
# Se ejecuta al tocar mobile/** o manualmente desde la pestaña Actions ("Run workflow").

on:
  push:
    branches: ['**']
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APKs (Inventario + Repo)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug \
            -PSUPABASE_URL="${{ vars.SUPABASE_URL || 'https://xeuezawuivushqrkzjqq.supabase.co' }}" \
            -PSUPABASE_ANON_KEY="${{ vars.SUPABASE_ANON_KEY || 'sb_publishable_hluqQhuiQ4JMTNNAu8kctQ_0TbjPtzL' }}"

      - name: Upload APK - Inventario
        uses: actions/upload-artifact@v4
        with:
          name: rack-one-inventario-debug-apk
          path: mobile/app/build/outputs/apk/inventario/debug/app-inventario-debug.apk
          if-no-files-found: error

      - name: Upload APK - Repo
        uses: actions/upload-artifact@v4
        with:
          name: rack-one-repo-debug-apk
          path: mobile/app/build/outputs/apk/repo/debug/app-repo-debug.apk
          if-no-files-found: error
