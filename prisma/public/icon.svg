<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Prisma">
  <defs>
    <linearGradient id="diamond" x1="140" y1="120" x2="380" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.55" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0A1B4D"/>
    </linearGradient>
    <linearGradient id="orbit" x1="60" y1="120" x2="452" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E5BFF"/>
      <stop offset="1" stop-color="#0A1B4D"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#F5F7FB"/>
  <!-- orbit ring -->
  <g fill="none" stroke="url(#orbit)" stroke-width="26" stroke-linecap="round" transform="rotate(-24 256 256)">
    <path d="M256 128 A188 108 0 0 1 402 300"/>
    <path d="M256 384 A188 108 0 0 1 110 212"/>
  </g>
  <!-- faceted diamond -->
  <g stroke="#0A1B4D" stroke-width="6" stroke-linejoin="round">
    <polygon points="256,150 350,232 256,264" fill="#38BDF8"/>
    <polygon points="256,150 162,232 256,264" fill="#2563EB"/>
    <polygon points="162,232 256,264 256,404" fill="#0F2E86"/>
    <polygon points="350,232 256,264 256,404" fill="#1E5BFF"/>
  </g>
</svg>
